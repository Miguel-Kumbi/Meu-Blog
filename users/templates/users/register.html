{% extends "base.html" %}

{% block title %}
	Registrar
{% endblock %}

{% block content %}

	<h1>Criar conta</h1>

	<form method="post">

		{% csrf_token %}

		{{ form.as_p }}

		<button type="submit">
			Registrar
		</button>

	</form>

	<p>
		Já tens uma conta?
		<a href="{% url 'login' %}">
			Entrar
		</a>
	</p>

{% endblock %}
