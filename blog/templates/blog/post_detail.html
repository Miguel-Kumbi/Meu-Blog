{% extends 'base.html' %}

{% block title %}
	{{post.title}}
{% endblock %}

{% block content %}
	<article>
		<h1>{{ post.title }}</h1>
		<p>
			Autor: {{ post.author }}
		</p>

		<p>
			Categoria: {{ post.category }}
		</p>

		<p>
			Criado em: {{ post.created_at }}
		</p>

		<div>
			{{ post.content }}
		</div>

		<p>
			<a href="{% url 'post_update' post.slug %}">Editar Post</a>
		</p>
	</article>
{% endblock %}
