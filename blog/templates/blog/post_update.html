{% extends "base.html" %}

{% block title %}
	Editar {{ post.title }} | Meu Blog
{% endblock %}

{% block content %}

<div class="row justify-content-center">

	<div class="col-12 col-lg-8">

		<div class="mb-4">
			<h1 class="fw-bold">
				Editar post
			</h1>

			<p class="text-muted">
				Atualize as informações do seu artigo.
			</p>
		</div>

		<div class="card shadow-sm">

			<div class="card-body p-4">

				{% include "blog/includes/post_form.html" with submit_text="Guardar Alterações" %}

			</div>

		</div>

	</div>

</div>

{% endblock %}
