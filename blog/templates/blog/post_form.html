{% extends 'base.html' %}

{% block title %}
	Criar Post
{% endblock %}

{% block content %}

	<h1>Criar Post</h1>

	<form method="post">

		{% csrf_token %} <!-- Garante que os dados enviados via método POST vieram realmente da aplicacão -->

		{{ form.as_p }}

		<button type="submit">
			Criar Post
		</button>

	</form>

{% endblock %}
