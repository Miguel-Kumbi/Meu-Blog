{% extends 'base.html' %}

{% block title %}
	{% if post %}
		Editar Post
	{% else %}
		Criar Post
	{% endif %}
{% endblock %}

{% block content %}

	{% if post %}
		<h1>Editar Post</h1>
	{% else %}
		<h1>Criar Post</h1>
	{% endif %}

	<form method="post">

		{% csrf_token %} <!-- Garante que os dados enviados via método POST vieram realmente da aplicacão -->

		{{ form.as_p }}

		<button type="submit">
			{% if post %}
				Guardar Alteracões
			{% else %}
				Criar Post
			{% endif %}
		</button>

	</form>

{% endblock %}
