{% extends 'base.html' %}

{% block title %}
	Blog
{% endblock %}

{% block content %}
	{% for post in posts %}
		<article>
			<a href="{% url 'post_detail' post.slug %}">
				<h2>{{ post.title }}</h2>
			</a>

			<p>
				{{ post.content }}
			</p>

			<p>
				Autor: {{ post.author }}
			</p>

			<p>
				Categoria: {{ post.category }}
			</p>
		</article>
	{% empty %}
		<p>Não há nenhum Post.</p>
	{% endfor %}

	<p>
		<a href="{% url 'post_create' %}">Adicionar Post</a>
	</p>
{% endblock %}
