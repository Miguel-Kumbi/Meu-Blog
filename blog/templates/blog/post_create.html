{% extends "base.html" %}

{% block title %}
    Novo Post | Meu Blog
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-lg-8">

        <div class="mb-4">
            <h1 class="fw-bold">
                Criar novo post
            </h1>

            <p class="text-muted">
                Escreva e guarde o seu artigo.
            </p>
        </div>

        <div class="card shadow-sm">

            <div class="card-body p-4">

                {% include "blog/includes/post_form.html" with submit_text="Guardar Post" %}

            </div>

        </div>

    </div>

</div>

{% endblock %}
