{% extends "base.html" %}

{% block title %}
    Login
{% endblock %}

{% block content %}

    <h1>Login</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <p>
            <label for="username">
                Username:
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </p>

        <p>
            <label for="password">
                Password:
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </p>

        <button type="submit">
            Entrar
        </button>

    </form>

{% endblock %}
