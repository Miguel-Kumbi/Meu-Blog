<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>
		{% block title %}Blog{% endblock %}
	</title>
</head>

<body>

	<header>
		<h1>
			<a href="{% url 'home' %}">Meu Blog</a>
		</h1>

		{% if user.is_authenticated %}
			<p>
				Olá, {{ user.username }}!
			</p>
			<a href="{% url 'drafts' %}">Meus Rascunhos</a>
			<a href="{% url 'logout' %}">Sair</a>
		{% else %}
			<a href="{% url 'login' %}">Entrar</a>
			<a href="{% url 'register' %}">Registrar</a>
		{% endif %}
		
	</header>

	<main>
		{% block content %}
		{% endblock %}
	</main>

</body>
</html>
